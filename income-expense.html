<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="财富">
<title>财富快照(加密)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="static/img/icons/apple-touch-icon.png">
<link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101826;
  color:#E7EDF5;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.lock-card{background:#182338;border:1px solid #2A3B58;border-radius:14px;padding:28px;
  width:min(92vw,360px);text-align:center}
.lock-card h3{margin:0 0 6px;font-size:16px}
.lock-card p{margin:0 0 16px;font-size:12px;color:#8A9BB5}
input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #33476B;
  background:#0F1828;color:#E7EDF5;font-size:15px;margin-bottom:10px;outline:none}
button{width:100%;padding:11px;border:none;border-radius:9px;background:#2E6FD8;
  color:#fff;font-size:15px;cursor:pointer}
button:hover{background:#3B7DEB}
.err{color:#E37B7B;font-size:12px;margin-top:8px;min-height:16px}
.aux{margin-top:14px;font-size:11.5px;color:#5F7292}
.aux a{color:#7FA7E8;text-decoration:none}
.aux a:active{opacity:.6}
.aux .dot{margin:0 8px;color:#3A4C6E}
</style></head><body>
<div class="lock-card">
  <h3>🔐 财富快照</h3>
  <p>数据已加密, 请输入访问口令</p>
  <input type="password" id="pw" placeholder="访问口令" autocomplete="current-password">
  <button onclick="tryUnlock()">解锁</button>
  <div class="err" id="err"></div>
  <div class="aux">
    <a href="javascript:void(0)" id="forget">忘记口令?</a><span class="dot">·</span>
    <a id="mirror" href="#">主站慢?试试镜像</a>
  </div>
</div>

async function deriveKey(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:Uint8Array.from(atob(B64S),c=>c.charCodeAt(0)),
    iterations:PBK_ITERS,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function decrypt(pw){
  const key=await deriveKey(pw);
  const iv=Uint8Array.from(atob(B64N),c=>c.charCodeAt(0));
  const ct=Uint8Array.from(atob(B64C),c=>c.charCodeAt(0));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder("utf-8").decode(pt);
}
/* 渲染解密后的页面。
   ⚠️ 不用 document.open/write: SW(clients.claim) 接管的文档上重建文档,
      Chromium 会让随后写入的样式表规则全部失效(2026-09-04 实测:
      样式表加载成功但 .m-tabbar 等规则不命中, 手机端布局整体溃退)。
   改为原位替换 documentElement.innerHTML(同一文档, 样式引擎不受影响),
   再按顺序重建 <script>(innerHTML 插入的脚本不执行, 手动重启并保序,
   chart.umd 必须先于页面内联脚本加载)。 */
function render(html){ localStorage.setItem("snap_pw",document.getElementById("pw").value);
  const inner=html.replace(/^[\s\S]*?<html[^>]*>/i,"").replace(/<\/html>[\s\S]*$/i,"");
  document.documentElement.setAttribute("data-innerhtml","ok");
  document.documentElement.innerHTML=inner;
  return (async()=>{
    const scripts=[...document.querySelectorAll("script")];
    for(const old of scripts){
      try{
        if(old.src){
          // 超时兜底: 解锁上下文里子资源加载可能永不完成, 不能让一个
          // 挂起的资源卡死整条脚本重建链(主逻辑脚本都在内联, src 仅剩兜底)
          const s=document.createElement("script");
          await new Promise(res=>{
            const t=setTimeout(res,7000);
            s.onload=s.onerror=()=>{clearTimeout(t);res();};
            s.src=old.src;
          });
          old.replaceWith(s);
        }else{
          // 内联脚本用间接 eval 执行: 本上下文里「克隆脚本元素 + replaceWith」
          // 的执行是间歇性的(innerHTML 解析来源的脚本带 parser 标志, 克隆后
          // Chromium 有时不再触发执行 — 2026-09-04 实测), 间接 eval 走编译器
          // 直执行, 全局作用域, 必定生效; 旧元素移除避免二次执行困惑
          old.remove();
          (0,eval)(old.textContent);
        }
      }catch(e){ document.documentElement.setAttribute("data-scripterr",String(e).slice(0,120)); }
    }
    document.documentElement.setAttribute("data-rebuild","ok");
  })();
}
async function tryUnlock(){
  const pw=document.getElementById("pw").value;
  try{ await render(await decrypt(pw)); }
  catch(e){ document.getElementById("err").textContent="口令错误";
    document.documentElement.setAttribute("data-unlockerr",String(e).slice(0,120)); }
}
(async()=>{ const p=localStorage.getItem("snap_pw");
  if(p){ try{ const h=await decrypt(p);
      document.getElementById("pw").value=p; render(h); return; }catch(e){} }
  document.getElementById("pw").focus();
})();
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});
document.getElementById("forget").addEventListener("click",function(){
  localStorage.removeItem("snap_pw"); location.reload(); });
(function(){ var m=document.getElementById("mirror");
  var h=location.hostname;
  if(h.indexOf("jsdelivr")>=0||h.indexOf("edgeone")>=0){ m.parentNode.style.display="none"; return; }
  var page=location.pathname.split("/").pop()||"mirror.html";
  if(page.indexOf(".html")<0||page==="index.html") page="mirror.html";
  var base="";
  if(!base){ base="https://cdn.jsdelivr.net/gh/neijianglm/wealth-view@snap/"; }
  else{ if(base.charAt(base.length-1)!=="/") base+="/";
        m.textContent="主站慢?试试国内加速"; }
  m.href=base+page;
})();
